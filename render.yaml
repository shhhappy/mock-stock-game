services:
  - type: web
    name: mock-stock-game
    env: python
    plan: free
    region: singapore
    buildCommand: python -m pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
