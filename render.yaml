services:
  - type: web
    name: mock-stock-game
    env: python
    plan: free
    region: singapore
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 -m gunicorn app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
