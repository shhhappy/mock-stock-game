services:
  - type: web
    name: mock-stock-game
    env: python
    plan: free
    region: singapore
    buildCommand: python -m pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 48 --worker-class gthread --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mock-stock-game-db
          property: connectionString

databases:
  - name: mock-stock-game-db
    plan: free
    region: singapore
