<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>참여 QR 코드</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --s2: #21262d; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .wrap {
    display: flex; gap: 32px; align-items: stretch; max-width: 1100px; width: 100%;
    flex-wrap: wrap; justify-content: center;
  }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 320px;
  }
  #room-name { font-size: 15px; color: var(--muted); margin-bottom: 4px; text-align: center; }
  #qr-canvas { line-height: 0; border-radius: 12px; overflow: hidden; background: #fff; padding: 10px; }
  #room-code {
    margin-top: 18px; font-size: 42px; font-weight: 800; letter-spacing: 10px; color: var(--accent);
  }
  .hint { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .memo-panel {
    flex: 1; min-width: 320px; max-width: 480px; align-items: stretch;
  }
  .memo-panel .memo-header {
    display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 10px;
  }
  .memo-panel .memo-header span:first-child { font-weight: 700; font-size: 15px; }
  #memo-status { font-size: 12px; color: var(--muted); }
  #memo-box {
    width: 100%; flex: 1; min-height: 380px; resize: vertical;
    background: var(--s2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); line-height: 1.6; padding: 14px;
    font-family: inherit; outline: none;
  }
  #memo-box:focus { border-color: var(--accent); }
  .size-ctrl {
    display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 14px;
    font-size: 12px; color: var(--muted);
  }
  .size-ctrl input[type="range"] { flex: 1; accent-color: var(--accent); }
  .size-ctrl .size-val { width: 34px; text-align: right; flex-shrink: 0; }
  @media (max-width: 720px) {
    .wrap { flex-direction: column; align-items: center; }
    .panel, .memo-panel { width: 100%; max-width: 480px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div id="room-name"></div>
      <div id="qr-canvas"></div>
      <div id="room-code">–</div>
      <div class="hint">📱 카메라로 QR을 찍거나 코드를 직접 입력해 참여하세요</div>
      <div class="size-ctrl">
        <span>QR 크기</span>
        <input type="range" id="qr-size-slider" min="160" max="560" step="20" value="320">
        <span class="size-val" id="qr-size-val">320</span>
      </div>
    </div>
    <div class="panel memo-panel">
      <div class="memo-header">
        <span>📝 메모</span>
        <span id="memo-status"></span>
      </div>
      <textarea id="memo-box" placeholder="수업 중 메모를 여기에 적어두세요 (이 창에만 저장됩니다)"></textarea>
      <div class="size-ctrl">
        <span>글자 크기</span>
        <input type="range" id="memo-size-slider" min="12" max="36" step="2" value="15">
        <span class="size-val" id="memo-size-val">15</span>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const code = (params.get('code') || '').toUpperCase();
  const name = params.get('name') || '';

  document.getElementById('room-name').textContent = name;
  document.getElementById('room-code').textContent = code || '–';

  // ── QR 크기 조절 (슬라이더 값은 기기에 공통으로 저장 — 다음에 열 때도 유지) ──
  const qrCanvas = document.getElementById('qr-canvas');
  const qrSlider = document.getElementById('qr-size-slider');
  const qrSizeVal = document.getElementById('qr-size-val');

  function renderQR(size) {
    qrCanvas.innerHTML = '';
    if (!code) return;
    const joinUrl = `${location.origin}/?code=${code}`;
    new QRCode(qrCanvas, {
      text: joinUrl, width: size, height: size,
      colorDark: '#0d1117', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
  }

  let savedQrSize = 320;
  try { savedQrSize = parseInt(localStorage.getItem('qrDisplayQrSize')) || 320; } catch(e) {}
  qrSlider.value = savedQrSize;
  qrSizeVal.textContent = savedQrSize;
  renderQR(savedQrSize);

  qrSlider.addEventListener('input', () => {
    const size = parseInt(qrSlider.value);
    qrSizeVal.textContent = size;
    renderQR(size);
    try { localStorage.setItem('qrDisplayQrSize', size); } catch(e) {}
  });

  // ── 메모: 방 코드별로 이 창(브라우저)에만 저장 ──────────────
  const memoKey = code ? `qrDisplayMemo:${code}` : 'qrDisplayMemo:unknown';
  const memoBox = document.getElementById('memo-box');
  const statusEl = document.getElementById('memo-status');
  try { memoBox.value = localStorage.getItem(memoKey) || ''; } catch(e) {}

  let saveTimer = null;
  memoBox.addEventListener('input', () => {
    statusEl.textContent = '저장 중…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(memoKey, memoBox.value);
        statusEl.textContent = '저장됨 ✓';
      } catch(e) {
        statusEl.textContent = '저장 실패';
      }
    }, 400);
  });

  // ── 메모 글자 크기 조절 (기기 공통 저장) ──────────────────
  const memoSlider = document.getElementById('memo-size-slider');
  const memoSizeVal = document.getElementById('memo-size-val');
  let savedMemoSize = 15;
  try { savedMemoSize = parseInt(localStorage.getItem('qrDisplayMemoSize')) || 15; } catch(e) {}
  memoSlider.value = savedMemoSize;
  memoSizeVal.textContent = savedMemoSize;
  memoBox.style.fontSize = savedMemoSize + 'px';

  memoSlider.addEventListener('input', () => {
    const size = parseInt(memoSlider.value);
    memoSizeVal.textContent = size;
    memoBox.style.fontSize = size + 'px';
    try { localStorage.setItem('qrDisplayMemoSize', size); } catch(e) {}
  });
</script>
</body>
</html>
