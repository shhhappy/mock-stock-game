<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍅 집중 타이머</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;">
  <div class="screen-header">
    <span></span>
    <span style="font-weight:700">🍅 집중 타이머</span>
    <a href="/" class="back-btn" style="font-size:12px">주식게임 →</a>
  </div>
  <div class="pt-body">

    <div id="pt-glow" class="pt-glow"></div>

    <div style="font-size:11px;color:var(--muted);letter-spacing:0.2em;margin-bottom:20px;text-align:center">
      CYCLE #<span id="pt-cycle">1</span> &nbsp;·&nbsp; 🍅 ×<span id="pt-pomodoro-count">0</span>
    </div>

    <div style="display:flex;gap:6px;margin-bottom:28px">
      <button class="pt-mode-btn" id="pt-tab-study"  onclick="ptSwitchMode('study')">공부</button>
      <button class="pt-mode-btn" id="pt-tab-short"  onclick="ptSwitchMode('short')">짧은 휴식</button>
      <button class="pt-mode-btn" id="pt-tab-long"   onclick="ptSwitchMode('long')">긴 휴식</button>
    </div>

    <div style="position:relative;margin-bottom:24px">
      <svg width="280" height="280" style="transform:rotate(-90deg)">
        <circle cx="140" cy="140" r="110" fill="none" stroke="#1A1A22" stroke-width="6"/>
        <g id="pt-ticks"></g>
        <circle id="pt-progress-ring" cx="140" cy="140" r="110" fill="none"
          stroke="#FF6B6B" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="691.15" stroke-dashoffset="0"
          style="transition:stroke-dashoffset 0.5s ease,stroke 0.6s ease"/>
      </svg>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none">
        <div id="pt-time-display" class="pt-time-display">25:00</div>
        <div id="pt-mode-label" class="pt-mode-label">공부</div>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:24px" id="pt-dots">
      <div class="pt-dot" id="pt-dot-0"></div>
      <div class="pt-dot" id="pt-dot-1"></div>
      <div class="pt-dot" id="pt-dot-2"></div>
      <div class="pt-dot" id="pt-dot-3"></div>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:28px">
      <button id="pt-start-btn" onclick="ptToggle()" class="pt-start-btn">▶ 시작</button>
      <button onclick="ptReset()" class="btn btn-secondary" style="padding:12px 18px;font-size:18px;line-height:1">↺</button>
    </div>

    <div style="display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;justify-content:center">
      <div class="pt-stat-card">
        <div class="pt-stat-label">총 공부</div>
        <div class="pt-stat-value" id="pt-total-study">—</div>
      </div>
      <div class="pt-stat-card">
        <div class="pt-stat-label">포모도로</div>
        <div class="pt-stat-value" id="pt-total-pomo">🍅 ×0</div>
      </div>
      <div class="pt-stat-card">
        <div class="pt-stat-label">사이클</div>
        <div class="pt-stat-value" id="pt-cycle-stat">#1</div>
      </div>
    </div>

    <div class="pt-settings-card">
      <div style="font-size:10px;color:var(--muted);letter-spacing:0.2em;margin-bottom:12px">TIME SETTINGS (MIN)</div>
      <div style="display:flex;gap:12px">
        <div style="flex:1;text-align:center">
          <div style="font-size:10px;color:var(--muted);margin-bottom:6px">공부</div>
          <input type="number" id="pt-custom-study" class="pt-time-input" value="25" min="1" max="99"
            oninput="ptCustomChange('study',this.value)">
        </div>
        <div style="flex:1;text-align:center">
          <div style="font-size:10px;color:var(--muted);margin-bottom:6px">짧은휴식</div>
          <input type="number" id="pt-custom-short" class="pt-time-input" value="5" min="1" max="99"
            oninput="ptCustomChange('short',this.value)">
        </div>
        <div style="flex:1;text-align:center">
          <div style="font-size:10px;color:var(--muted);margin-bottom:6px">긴휴식</div>
          <input type="number" id="pt-custom-long" class="pt-time-input" value="15" min="1" max="99"
            oninput="ptCustomChange('long',this.value)">
        </div>
      </div>
    </div>

    <div id="pt-sessions-wrap" style="width:100%;max-width:320px;display:none;margin-top:20px">
      <div style="font-size:10px;color:var(--muted);letter-spacing:0.2em;margin-bottom:8px">RECENT SESSIONS</div>
      <div id="pt-sessions-list" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>

  </div>
</div>

<script src="/static/js/pomodoro.js"></script>
</body>
</html>
